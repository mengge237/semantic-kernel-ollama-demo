name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: 还原与构建
        run: |
          # 根目录同时有 .sln 和 .csproj 时 dotnet 会报 MSB1011 不知道选哪个，所以显式挑一个
          TARGET=$(ls *.sln 2>/dev/null | head -1)
          if [ -z "$TARGET" ]; then TARGET=$(ls *.csproj 2>/dev/null | head -1); fi
          echo "构建目标: $TARGET"
          dotnet restore "$TARGET"
          dotnet build "$TARGET" --no-restore -c Release
